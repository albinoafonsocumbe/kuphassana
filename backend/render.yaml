services:
  - type: web
    name: kuphassana-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run setup
    startCommand: node src/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: kuphassana-db
          property: connectionString

databases:
  - name: kuphassana-db
    databaseName: kuphassana
    user: kuphassana
    plan: free
