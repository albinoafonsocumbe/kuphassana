<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta — Plataforma Funerária</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <style>
        .auth-card { max-width: 500px; }
        .tipo-conta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .75rem;
            margin-bottom: 1.75rem;
        }
        .tipo-btn {
            padding: .9rem;
            border: 2px solid var(--cor-borda);
            border-radius: 10px;
            background: var(--branco-suave);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-family: var(--fonte-corpo);
        }
        .tipo-btn .tipo-icone { font-size: 1.5rem; display: block; margin-bottom: .3rem; }
        .tipo-btn .tipo-nome  { font-size: .82rem; font-weight: 700; color: var(--cinza-escuro); display: block; }
        .tipo-btn .tipo-desc  { font-size: .72rem; color: var(--cor-texto-leve); display: block; margin-top: .1rem; }
        .tipo-btn.activo {
            border-color: var(--dourado);
            background: rgba(201,168,76,0.06);
        }
        .tipo-btn:hover { border-color: var(--dourado); }
    </style>
</head>
<body class="auth-page">

<nav class="navbar">
    <div class="navbar-logo">
        <span class="cruz">✝</span>
        Plataforma <span>Funerária</span>
    </div>
    <div class="navbar-links">
        <a href="../index.html">← Voltar ao início</a>
    </div>
</nav>

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-logo">
            <span class="cruz">✝</span>
            Plataforma <span>Funerária</span>
        </div>
        <div class="auth-divider"></div>

        <h2>Criar conta</h2>
        <p class="auth-subtitulo">Escolha o tipo de conta que pretende criar</p>

        <!-- Seletor de tipo -->
        <div class="tipo-conta">
            <button class="tipo-btn activo" id="btn-tipo-cliente" onclick="selecionarTipo('cliente')">
                <span class="tipo-icone">👤</span>
                <span class="tipo-nome">Cliente</span>
                <span class="tipo-desc">Quero contratar serviços</span>
            </button>
            <button class="tipo-btn" id="btn-tipo-prestador" onclick="selecionarTipo('prestador')">
                <span class="tipo-icone">🏢</span>
                <span class="tipo-nome">Prestador</span>
                <span class="tipo-desc">Quero oferecer serviços</span>
            </button>
        </div>

        <div id="auth-erro" class="auth-erro">
            <span>⚠</span> <span id="auth-erro-msg"></span>
        </div>
        <div id="auth-sucesso" class="auth-sucesso">
            <span>✓</span> <span id="auth-suc-msg"></span>
        </div>

        <form id="form-reg">
            <div class="grupo">
                <label id="label-nome">Nome completo *</label>
                <input type="text" id="nome" placeholder="O seu nome completo" required />
            </div>

            <div class="grupo">
                <label>Email *</label>
                <input type="email" id="email" placeholder="email@exemplo.pt" required autocomplete="email" />
            </div>

            <div class="linha-dupla">
                <div class="grupo">
                    <label>Telefone</label>
                    <input type="tel" id="telefone" placeholder="912 345 678" />
                </div>
                <div class="grupo">
                    <label>Cidade</label>
                    <input type="text" id="cidade" placeholder="Lisboa" />
                </div>
            </div>

            <!-- Campo extra para prestador -->
            <div id="campo-morada" class="grupo" style="display:none;">
                <label>Morada da empresa</label>
                <input type="text" id="morada" placeholder="Rua Exemplo, 123" />
            </div>

            <div class="grupo">
                <label>Senha *</label>
                <input type="password" id="senha" placeholder="Mínimo 6 caracteres"
                       required minlength="6" autocomplete="new-password" />
                <div class="forca-senha"><div id="barra-forca"></div></div>
                <div class="forca-label" id="dica-forca"></div>
            </div>

            <div class="grupo">
                <label>Confirmar senha *</label>
                <input type="password" id="confirmar" placeholder="Repetir senha"
                       required autocomplete="new-password" />
            </div>

            <button type="submit" class="btn-auth" id="btn-reg">
                <span id="btn-texto">Criar conta gratuitamente</span>
            </button>
        </form>

        <div class="auth-sep">ou</div>
        <div class="auth-rodape">
            Já tem conta? <a href="login.html">Entrar</a>
        </div>
    </div>
</div>

<footer><p>© 2026 Plataforma Funerária — Todos os direitos reservados.</p></footer>

<script src="../js/api.js"></script>
<script>
let tipoActual = 'cliente';

function selecionarTipo(tipo) {
    tipoActual = tipo;
    document.getElementById('btn-tipo-cliente').classList.toggle('activo',   tipo === 'cliente');
    document.getElementById('btn-tipo-prestador').classList.toggle('activo', tipo === 'prestador');
    document.getElementById('label-nome').textContent = tipo === 'prestador'
        ? 'Nome da empresa / prestador *'
        : 'Nome completo *';
    document.getElementById('nome').placeholder = tipo === 'prestador'
        ? 'Funerária Silva, Lda.'
        : 'O seu nome completo';
    document.getElementById('campo-morada').style.display = tipo === 'prestador' ? 'block' : 'none';
}

// Força da senha
document.getElementById('senha').addEventListener('input', function () {
    const v = this.value;
    let f = 0;
    if (v.length >= 6) f++;
    if (v.length >= 10) f++;
    if (/[A-Z]/.test(v)) f++;
    if (/[0-9]/.test(v)) f++;
    if (/[^A-Za-z0-9]/.test(v)) f++;
    const n = [
        { w:'0%', c:'', t:'' },
        { w:'25%', c:'#e74c3c', t:'Fraca' },
        { w:'50%', c:'#e67e22', t:'Razoável' },
        { w:'75%', c:'#f1c40f', t:'Boa' },
        { w:'100%', c:'#2ecc71', t:'Excelente' }
    ][Math.min(f,4)];
    const b = document.getElementById('barra-forca');
    b.style.width = n.w; b.style.background = n.c;
    const d = document.getElementById('dica-forca');
    d.textContent = n.t; d.style.color = n.c;
});

document.getElementById('form-reg').addEventListener('submit', async (e) => {
    e.preventDefault();

    const nome     = document.getElementById('nome').value.trim();
    const email    = document.getElementById('email').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const cidade   = document.getElementById('cidade').value.trim();
    const morada   = document.getElementById('morada').value.trim();
    const senha    = document.getElementById('senha').value;
    const confirmar= document.getElementById('confirmar').value;

    const elErro = document.getElementById('auth-erro');
    const elSuc  = document.getElementById('auth-sucesso');
    const btn    = document.getElementById('btn-reg');
    const texto  = document.getElementById('btn-texto');

    elErro.classList.remove('visivel');
    elSuc.classList.remove('visivel');

    if (senha !== confirmar) {
        document.getElementById('auth-erro-msg').textContent = 'As senhas não coincidem.';
        elErro.classList.add('visivel');
        return;
    }

    btn.disabled = true;
    texto.textContent = 'A criar conta…';

    try {
        let res;
        if (tipoActual === 'cliente') {
            res = await api.auth.registarCliente({ nome, email, telefone, cidade, senha });
        } else {
            res = await api.auth.registar({ nome, email, telefone, cidade, morada, senha });
        }

        Auth.guardarToken(res.token);
        Auth.guardarUtilizador(res.utilizador);

        document.getElementById('auth-suc-msg').textContent = 'Conta criada! A redirecionar…';
        elSuc.classList.add('visivel');

        setTimeout(() => {
            const u = res.utilizador;
            window.location.href = u.papel === 'admin'
                ? 'admin.html'
                : u.papel === 'cliente'
                    ? 'painel-cliente.html'
                    : 'painel.html';
        }, 1200);

    } catch (err) {
        document.getElementById('auth-erro-msg').textContent = err.message;
        elErro.classList.add('visivel');
        btn.disabled = false;
        texto.textContent = 'Criar conta gratuitamente';
    }
});
</script>
</body>
</html>
